<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" 
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" 
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Favicon -->
    <link rel="icon" href="https://openweathermap.org/img/wn/02d.png" type="image/png">
  </head>
  <body>
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card text-center p-4" style="border-radius: 20px">
            <h1 class="mb-3">
              <i class="fas fa-cloud-sun-rain mr-2"></i>Weather Dashboard
            </h1>
            <div id="currentTime" class="mb-4"></div>
            <div class="form-group position-relative">
              <input
                type="text"
                id="cityInput"
                class="form-control"
                placeholder="Nhập tên thành phố..."
                autofocus
              />
              <!-- <i class="fas fa-search search-icon"></i> -->
            </div>
            <button id="getWeatherBtn" class="btn btn-primary">
              <i class="fas fa-search mr-2"></i>Xem thời tiết
            </button>
            
            <div id="weatherInfo" class="mt-4 text-left">
              <!-- Weather data will be displayed here -->
              <div class="text-center initial-message">
                <i class="fas fa-cloud-sun fa-3x mb-3"></i>
                <p>Nhập tên thành phố để xem thông tin thời tiết</p>
              </div>
            </div>
            
            <div class="chart-container" style="position: relative; height: 250px;">
              <canvas id="temperatureChart" class="mt-4"></canvas>
            </div>
            
            <div class="footer mt-4">
              <small>
                <i class="fas fa-code mr-1"></i> with Wyatt D.P
                Powered by OpenWeatherMap API
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
  </body>
</html>
